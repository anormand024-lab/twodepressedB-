<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visual Novel</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ── ÉCRAN TITRE ── -->
  <div id="title-screen">
    <div class="title-content">
      <h1 id="game-title">Mon Visual Novel</h1>
      <p id="game-subtitle">Une histoire à découvrir…</p>
      <button id="btn-start">▶ Commencer</button>
    </div>
  </div>

  <!-- ── SCÈNE PRINCIPALE ── -->
  <div id="game-screen" class="hidden">

    <!-- Arrière-plan -->
    <div id="background"></div>

    <!-- Personnage -->
    <div id="character-container">
      <img id="character-img" src="" alt="Personnage" />
    </div>

    <!-- Boîte de dialogue -->
    <div id="dialogue-box">
      <div id="dialogue-header">
        <span id="character-name"></span>
      </div>
      <div id="dialogue-text-wrapper">
        <p id="dialogue-text"></p>
        <span id="next-arrow">▼</span>
      </div>

      <!-- Choix (optionnel) -->
      <div id="choices-container" class="hidden"></div>
    </div>

    <!-- Barre d'outils -->
    <div id="toolbar">
      <button class="tool-btn" id="btn-auto" title="Auto">⏵ Auto</button>
      <button class="tool-btn" id="btn-skip" title="Passer">⏭ Passer</button>
      <button class="tool-btn" id="btn-log"  title="Journal">📜 Log</button>
      <button class="tool-btn" id="btn-save" title="Sauvegarder">💾 Save</button>
      <button class="tool-btn" id="btn-load" title="Charger">📂 Load</button>
    </div>

    <!-- Journal (historique) -->
    <div id="log-panel" class="hidden">
      <div id="log-header">
        <span>Journal</span>
        <button id="btn-close-log">✕</button>
      </div>
      <div id="log-entries"></div>
    </div>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
