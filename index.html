<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mon Visual Novel</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0a0910;
  --panel:rgba(10,9,22,0.85);
  --border:rgba(180,160,255,0.18);
  --accent:#b89fff;
  --accent2:#7c5ccc;
  --text:#ede9ff;
  --name:#d4c5ff;
  --muted:#6e6590;
  --r:14px;
}

body{
  background:var(--bg);
  font-family:'Segoe UI',system-ui,sans-serif;
  color:var(--text);
  height:100dvh;
  overflow:hidden;
  user-select:none;
}

.hidden{display:none!important}

/* ── TITRE ── */
#title-screen{
  position:fixed;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:200;
  background:#0a0910;
  overflow:hidden;
}

/* étoiles */
#title-screen::before{
  content:'';
  position:absolute;inset:0;
  background-image:
    radial-gradient(1px 1px at 20% 15%, #fff 0%, transparent 100%),
    radial-gradient(1px 1px at 55% 40%, rgba(255,255,255,.7) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 80% 20%, #fff 0%, transparent 100%),
    radial-gradient(1px 1px at 35% 70%, rgba(255,255,255,.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 65% 80%, rgba(255,255,255,.6) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 10% 55%, #fff 0%, transparent 100%),
    radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 45% 25%, rgba(255,255,255,.8) 0%, transparent 100%),
    radial-gradient(1px 1px at 75% 50%, rgba(255,255,255,.5) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 25% 85%, #fff 0%, transparent 100%),
    radial-gradient(1px 1px at 5% 30%, rgba(255,255,255,.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 92% 38%, rgba(255,255,255,.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 48% 92%, rgba(255,255,255,.4) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 60% 10%, #fff 0%, transparent 100%),
    radial-gradient(1px 1px at 15% 45%, rgba(255,255,255,.7) 0%, transparent 100%);
  pointer-events:none;
}

/* lueur centrale */
#title-screen::after{
  content:'';
  position:absolute;
  width:600px;height:400px;
  top:50%;left:50%;
  transform:translate(-50%,-60%);
  background:radial-gradient(ellipse, rgba(120,80,220,0.22) 0%, transparent 70%);
  pointer-events:none;
}

.title-inner{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;
  gap:1.2rem;
  animation:fadeUp .9s ease both;
}

/* ligne décorative */
.title-deco{
  display:flex;align-items:center;gap:12px;
  margin-bottom:.4rem;
}
.title-deco span{
  display:block;height:1px;width:60px;
  background:linear-gradient(90deg,transparent,var(--accent2));
}
.title-deco span:last-child{
  background:linear-gradient(90deg,var(--accent2),transparent);
}
.title-deco i{
  font-size:16px;color:var(--accent2);letter-spacing:.2em;
}

#game-title{
  font-family:Georgia,serif;
  font-size:clamp(2.4rem,6vw,4.2rem);
  font-weight:normal;
  letter-spacing:.1em;
  color:var(--name);
  text-shadow:0 0 60px rgba(160,120,255,.4);
  line-height:1.1;
}

#game-subtitle{
  font-size:.95rem;
  color:var(--muted);
  letter-spacing:.22em;
  text-transform:uppercase;
}

.title-sep{
  width:1px;height:40px;
  background:linear-gradient(to bottom,transparent,var(--border),transparent);
  margin:.2rem 0;
}

#btn-start{
  margin-top:.5rem;
  padding:.7rem 2.6rem;
  font-size:.9rem;
  font-family:inherit;
  letter-spacing:.14em;
  text-transform:uppercase;
  background:transparent;
  color:var(--accent);
  border:1px solid var(--accent2);
  border-radius:40px;
  cursor:pointer;
  transition:background .25s,color .25s,border-color .25s,box-shadow .25s;
  position:relative;
  overflow:hidden;
}
#btn-start::before{
  content:'';
  position:absolute;inset:0;
  background:var(--accent2);
  opacity:0;
  transition:opacity .25s;
  border-radius:40px;
}
#btn-start:hover{
  color:#fff;
  border-color:var(--accent);
  box-shadow:0 0 28px rgba(140,100,255,.35);
}
#btn-start:hover::before{opacity:1}
#btn-start span{position:relative;z-index:1}

/* ── SCÈNE ── */
#game-screen{
  position:fixed;inset:0;
  display:flex;align-items:flex-end;justify-content:center;
}

#background{
  position:absolute;inset:0;
  background-size:cover;
  background-position:center;
  transition:opacity .55s ease;
}
#background::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to top,rgba(8,6,20,.75) 0%,rgba(8,6,20,.15) 50%,transparent 100%);
}

#character-container{
  position:absolute;bottom:155px;left:50%;
  transform:translateX(-50%);
  pointer-events:none;
  max-height:70vh;
  display:flex;align-items:flex-end;
  transition:opacity .4s;
}
#character-img{
  max-height:70vh;max-width:38vw;
  object-fit:contain;
  filter:drop-shadow(0 6px 28px rgba(0,0,0,.75));
}
#character-img.fi{animation:charIn .4s ease both}
#character-img.fo{animation:charOut .3s ease both}

/* ── BOÎTE DIALOGUE ── */
#dialogue-box{
  position:relative;z-index:10;
  width:min(800px,94vw);
  margin-bottom:24px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--r);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:0 2px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(180,160,255,.08);
  cursor:pointer;
  overflow:hidden;
}

/* trait coloré en haut */
#dialogue-box::before{
  content:'';
  display:block;height:2px;
  background:linear-gradient(90deg,transparent 0%,var(--accent2) 30%,var(--accent) 60%,transparent 100%);
  opacity:.6;
}

#dialogue-header{padding:.55rem 1.1rem .1rem}

#character-name{
  display:inline-block;
  font-family:Georgia,serif;
  font-size:.95rem;font-weight:normal;
  color:var(--name);
  letter-spacing:.08em;
  padding:.15rem 0;
  border-bottom:1.5px solid var(--accent2);
  min-width:50px;min-height:1.3em;
  opacity:.92;
}

#dialogue-text-wrapper{
  padding:.65rem 1.1rem .9rem;
  position:relative;
}
#dialogue-text{
  font-size:clamp(.95rem,2vw,1.05rem);
  line-height:1.8;
  color:var(--text);
  min-height:3em;
  white-space:pre-line;
}
#next-arrow{
  position:absolute;bottom:.55rem;right:1rem;
  color:var(--accent);font-size:.8rem;
  animation:bounce 1.1s infinite;opacity:.7;
}

#choices-container{
  display:flex;flex-direction:column;gap:.45rem;
  padding:.3rem 1.1rem .9rem;
}
.choice-btn{
  padding:.6rem .9rem;
  background:rgba(140,100,255,.06);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);font-size:.93rem;
  cursor:pointer;text-align:left;
  transition:background .2s,border-color .2s;
}
.choice-btn:hover{background:rgba(140,100,255,.18);border-color:var(--accent2)}

/* ── TOOLBAR ── */
#toolbar{
  position:fixed;top:14px;right:14px;
  display:flex;gap:7px;z-index:20;
}
.tool-btn{
  padding:.35rem .85rem;font-size:.75rem;
  font-family:inherit;
  background:var(--panel);color:var(--muted);
  border:1px solid var(--border);border-radius:20px;
  cursor:pointer;
  backdrop-filter:blur(12px);
  transition:color .2s,border-color .2s;
}
.tool-btn:hover,.tool-btn.active{color:var(--accent);border-color:var(--accent2)}

/* ── LOG ── */
#log-panel{
  position:fixed;inset:0;z-index:50;
  background:rgba(8,6,20,.96);backdrop-filter:blur(22px);
  display:flex;flex-direction:column;
  animation:fadeUp .2s ease both;
}
#log-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:1rem 1.4rem;
  border-bottom:1px solid var(--border);
  font-family:Georgia,serif;font-size:1rem;color:var(--name);
}
#btn-close-log{
  background:none;border:none;color:var(--muted);
  font-size:1.1rem;cursor:pointer;transition:color .2s;
}
#btn-close-log:hover{color:var(--text)}
#log-entries{
  overflow-y:auto;padding:1rem 1.4rem 2rem;
  display:flex;flex-direction:column;gap:1.1rem;
}
.log-entry{display:flex;flex-direction:column;gap:.25rem}
.log-name{font-size:.82rem;color:var(--name);font-weight:600}
.log-line{font-size:.93rem;color:var(--muted);line-height:1.65}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@keyframes charIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes charOut{from{opacity:1}to{opacity:0}}
</style>
</head>
<body>

<!-- TITRE -->
<div id="title-screen">
  <div class="title-inner">
    <div class="title-deco">
      <span></span>
      <i>✦</i>
      <span></span>
    </div>
    <h1 id="game-title">Mon Visual Novel</h1>
    <p id="game-subtitle">Une histoire à découvrir</p>
    <div class="title-sep"></div>
    <button id="btn-start"><span>▶ Commencer</span></button>
  </div>
</div>

<!-- SCÈNE -->
<div id="game-screen" class="hidden">
  <div id="background"></div>
  <div id="character-container">
    <img id="character-img" src="" alt="Personnage"/>
  </div>
  <div id="dialogue-box">
    <div id="dialogue-header"><span id="character-name"></span></div>
    <div id="dialogue-text-wrapper">
      <p id="dialogue-text"></p>
      <span id="next-arrow">▼</span>
    </div>
    <div id="choices-container" class="hidden"></div>
  </div>
  <div id="toolbar">
    <button class="tool-btn" id="btn-auto">⏵ Auto</button>
    <button class="tool-btn" id="btn-skip">⏭ Passer</button>
    <button class="tool-btn" id="btn-log">📜 Log</button>
    <button class="tool-btn" id="btn-save">💾 Save</button>
    <button class="tool-btn" id="btn-load">📂 Load</button>
  </div>
  <div id="log-panel" class="hidden">
    <div id="log-header">
      <span>Journal</span>
      <button id="btn-close-log">✕</button>
    </div>
    <div id="log-entries"></div>
  </div>
</div>

<script>
// ============================================================
//  SCÉNARIO — modifie cette partie pour créer ton histoire
// ============================================================
//
//  Chaque scène a un "id" unique que TU choisis.
//  Dans les choix, "next" pointe vers l'id d'une autre scène.
//
//  DIALOGUE :
//  {
//    id        : "nom_de_la_scene",
//    type      : "dialogue",
//    character : "Nom du perso",          ← "" pour narrateur
//    image     : "https://url-image.png", ← "" pour pas de perso
//    background: "https://url-fond.jpg",  ← "" pour ne pas changer
//    text      : "Le texte affiché."
//  }
//
//  CHOIX :
//  {
//    id   : "nom_du_choix",
//    type : "choice",
//    choices: [
//      { label: "Option A", next: "scene_a" },
//      { label: "Option B", next: "scene_b" },
//    ]
//  }
//
// ============================================================

const story = [

  // ── PROLOGUE ──────────────────────────────────────────────
  {
    id: "prologue_nuit",
    type: "dialogue",
    character: "",
    image: "",
    background: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=1280&q=80",
    text: "Une nuit froide de novembre. La ville dort sous un ciel sans étoiles…"
  },
  {
    id: "prologue_train",
    type: "dialogue",
    character: "Narrateur",
    image: "",
    background: "",
    text: "Le train entre en gare à minuit pile. Sur le quai désert, une silhouette attend."
  },

  // ── SCÈNE 1 ───────────────────────────────────────────────
  {
    id: "elara_arrive",
    type: "dialogue",
    character: "Elara",
    image: "https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=400&q=80",
    background: "https://images.unsplash.com/photo-1474487548417-781cb71495f3?w=1280&q=80",
    text: "Vous êtes enfin là. J'ai failli ne plus y croire."
  },
  {
    id: "elara_mystere",
    type: "dialogue",
    character: "Elara",
    image: "https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=400&q=80",
    background: "",
    text: "Il y a des choses que je dois vous montrer. Des choses que personne d'autre ne peut voir."
  },

  // ── CHOIX ─────────────────────────────────────────────────
  {
    id: "choix_1",
    type: "choice",
    choices: [
      { label: "« Je vous suis. »",   next: "branche_a_debut" },
      { label: "« Pourquoi moi ? »",  next: "branche_b_debut" },
    ]
  },

  // ── BRANCHE A ─────────────────────────────────────────────
  {
    id: "branche_a_debut",
    type: "dialogue",
    character: "Elara",
    image: "https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=400&q=80",
    background: "https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1280&q=80",
    text: "Bien. La nuit n'attend pas. Suivez-moi sans bruit."
  },
  {
    id: "branche_a_fin",
    type: "dialogue",
    character: "Elara",
    image: "https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=400&q=80",
    background: "",
    text: "Vous avez fait le bon choix. Vous verrez bientôt pourquoi."
  },
  {
    id: "fin_a",
    type: "dialogue",
    character: "Narrateur",
    image: "",
    background: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=1280&q=80",
    text: "— FIN DU CHAPITRE 1 —\n\nMerci d'avoir joué !"
  },

  // ── BRANCHE B ─────────────────────────────────────────────
  {
    id: "branche_b_debut",
    type: "dialogue",
    character: "Elara",
    image: "https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=400&q=80",
    background: "https://images.unsplash.com/photo-1474487548417-781cb71495f3?w=1280&q=80",
    text: "Parce que vous êtes le seul à pouvoir encore changer ce qui va arriver."
  },
  {
    id: "branche_b_suite",
    type: "dialogue",
    character: "Elara",
    image: "https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=400&q=80",
    background: "",
    text: "Je sais que c'est difficile à croire. Mais le temps presse. Venez."
  },
  {
    id: "fin_b",
    type: "dialogue",
    character: "Narrateur",
    image: "",
    background: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=1280&q=80",
    text: "— FIN DU CHAPITRE 1 —\n\nMerci d'avoir joué !"
  },
];

// ============================================================
//  MOTEUR — ne touche pas à cette partie
// ============================================================

// Table id → index
const idMap = {};
story.forEach((s,i) => { if(s.id) idMap[s.id] = i; });

const state = { index:0, autoMode:false, autoTimer:null, isTyping:false, log:[] };

// ── Helpers DOM ──
const el = id => document.getElementById(id);
const bg      = el('background');
const charCon = el('character-container');
const charImg = el('character-img');
const dBox    = el('dialogue-box');
const dName   = el('character-name');
const dText   = el('dialogue-text');
const dArrow  = el('next-arrow');
const dChoice = el('choices-container');
const logPanel= el('log-panel');
const logList = el('log-entries');
const btnAuto = el('btn-auto');
const btnSave = el('btn-save');
const btnLoad = el('btn-load');

// ── Navigation ──
function go(indexOrId){
  const idx = typeof indexOrId==='string' ? idMap[indexOrId] : indexOrId;
  if(idx===undefined||idx>=story.length) return;
  state.index=idx;
  const s=story[idx];
  if(s.type==='dialogue') showDialogue(s);
  if(s.type==='choice')   showChoices(s);
}

function showDialogue(s){
  dChoice.classList.add('hidden');
  dArrow.style.display='';
  if(s.background) bg.style.backgroundImage=`url('${s.background}')`;
  if(s.image){
    charImg.src=s.image;
    charCon.style.display='';
    charImg.className='fi';
  } else {
    charCon.style.display='none';
  }
  dName.textContent=s.character||'';
  typeText(s.text,()=>{ if(state.autoMode) state.autoTimer=setTimeout(advance,2200); });
  if(s.text) state.log.push({name:s.character||'Narrateur',line:s.text});
}

function showChoices(s){
  dArrow.style.display='none';
  dChoice.innerHTML='';
  dChoice.classList.remove('hidden');
  s.choices.forEach(c=>{
    const b=document.createElement('button');
    b.className='choice-btn';b.textContent=c.label;
    b.onclick=()=>{ dChoice.classList.add('hidden'); go(c.next); };
    dChoice.appendChild(b);
  });
}

function typeText(text,onDone){
  state.isTyping=true; dText.textContent=''; let i=0;
  const tick=()=>{
    if(i>=text.length){state.isTyping=false;if(onDone)onDone();return;}
    dText.textContent+=text[i++]; setTimeout(tick,26);
  };
  tick();
}

function advance(){
  if(state.isTyping){
    const s=story[state.index];
    if(s?.type==='dialogue'){state.isTyping=false;dText.textContent=s.text;}
    return;
  }
  const next=state.index+1;
  if(next<story.length) go(next);
}

// ── Log ──
function openLog(){
  logList.innerHTML='';
  state.log.forEach(e=>{
    const d=document.createElement('div');d.className='log-entry';
    d.innerHTML=`<span class="log-name">${e.name}</span><span class="log-line">${e.line}</span>`;
    logList.appendChild(d);
  });
  logPanel.classList.remove('hidden');
}

// ── Save / Load ──
function flash(btn,msg){
  const o=btn.textContent; btn.textContent=msg;
  setTimeout(()=>{btn.textContent=o;},1500);
}
function saveGame(){
  try{ localStorage.setItem('vn_save',JSON.stringify({index:state.index,log:[...state.log]})); flash(btnSave,'Sauvegardé ✓'); }
  catch{ alert('Impossible de sauvegarder.'); }
}
function loadGame(){
  try{
    const r=localStorage.getItem('vn_save');
    if(!r){alert('Aucune sauvegarde.');return;}
    const sl=JSON.parse(r); state.log=sl.log||[]; go(sl.index); flash(btnLoad,'Chargé ✓');
  } catch{ alert('Erreur chargement.'); }
}

// ── Événements ──
el('btn-start').onclick=()=>{
  el('title-screen').classList.add('hidden');
  el('game-screen').classList.remove('hidden');
  go(0);
};

dBox.onclick=()=>{
  if(!dChoice.classList.contains('hidden')) return;
  clearTimeout(state.autoTimer); advance();
};

document.onkeydown=e=>{
  if(!['Space','ArrowRight','Enter'].includes(e.code)) return;
  if(el('game-screen').classList.contains('hidden')) return;
  if(!dChoice.classList.contains('hidden')) return;
  clearTimeout(state.autoTimer); advance();
};

btnAuto.onclick=()=>{
  state.autoMode=!state.autoMode;
  btnAuto.classList.toggle('active',state.autoMode);
  if(!state.autoMode) clearTimeout(state.autoTimer);
  else if(!state.isTyping) state.autoTimer=setTimeout(advance,2200);
};

el('btn-skip').onclick=()=>{ clearTimeout(state.autoTimer); state.isTyping=false; advance(); };
el('btn-log').onclick=openLog;
el('btn-close-log').onclick=()=>logPanel.classList.add('hidden');
btnSave.onclick=saveGame;
btnLoad.onclick=loadGame;
</script>
</body>
</html>
