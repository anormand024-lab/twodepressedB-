<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Literary Club - Visual Novel</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&family=Share+Tech+Mono&display=swap');

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --pink: #f48fb1;
      --deep-pink: #c2185b;
      --dark: #0a0a0f;
      --darker: #050508;
      --glitch: #00ff88;
      --red-alert: #ff1744;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--darker);
      font-family: 'Crimson Pro', Georgia, serif;
      overflow: hidden;
      user-select: none;
    }

    #game {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* ── BACKGROUND ── */
    #bg {
      position: absolute;
      inset: 0;
      background: #1a0a1e;
      transition: background 1.2s ease;
      z-index: 0;
    }

    #bg.scene-classroom {
      background: linear-gradient(180deg, #0d1b2a 0%, #1b2838 60%, #0d1520 100%);
    }

    #bg.scene-club {
      background: linear-gradient(180deg, #1a0a1e 0%, #2d1b33 60%, #1a0f20 100%);
    }

    #bg.scene-void {
      background: #000;
    }

    #bg.scene-white {
      background: #fff;
    }

    /* ── CHARACTERS ── */
    #chars {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .char-sprite {
      position: absolute;
      bottom: 5%;
      width: 200px;
      height: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.6s cubic-bezier(.22,1,.36,1), opacity 0.5s;
      transform-origin: bottom center;
    }

    .char-sprite.hidden {
      opacity: 0;
      transform: translateY(40px) scale(0.95);
      pointer-events: none;
    }

    .char-sprite.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .char-sprite.dimmed {
      opacity: 0.4;
      filter: saturate(0.3);
    }

    .char-sprite.left {
      left: 10%;
    }

    .char-sprite.center {
      left: 50%;
      transform: translateX(-50%);
    }

    .char-sprite.center.visible {
      transform: translateX(-50%) translateY(0);
    }

    .char-sprite.right {
      right: 10%;
    }

    .char-svg {
      width: 200px;
      height: 340px;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.6));
      transition: filter 0.4s;
    }

    .char-sprite.active .char-svg {
      filter: drop-shadow(0 8px 24px rgba(244,143,177,0.4));
    }

    /* ── TEXTBOX ── */
    #textbox-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0 2.5% 2%;
      z-index: 50;
    }

    #textbox {
      background: rgba(8, 4, 14, 0.88);
      border: 1px solid rgba(244,143,177,0.25);
      border-radius: 4px;
      padding: 1.2rem 1.6rem 1.4rem;
      backdrop-filter: blur(8px);
      box-shadow: 0 -4px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(244,143,177,0.1);
      position: relative;
      min-height: 120px;
      cursor: pointer;
      transition: border-color 0.3s;
    }

    #textbox:hover {
      border-color: rgba(244,143,177,0.45);
    }

    #nametag {
      position: absolute;
      top: -2px;
      left: 1.6rem;
      transform: translateY(-100%);
      background: rgba(8, 4, 14, 0.9);
      border: 1px solid rgba(244,143,177,0.3);
      border-bottom: none;
      border-radius: 3px 3px 0 0;
      padding: 0.25rem 1rem 0.15rem;
      font-family: 'VT323', monospace;
      font-size: 1.3rem;
      color: var(--pink);
      letter-spacing: 0.05em;
      min-width: 80px;
      text-align: center;
    }

    #dialogue {
      font-size: 1.18rem;
      line-height: 1.65;
      color: #f0e8f5;
      font-weight: 300;
      letter-spacing: 0.01em;
      min-height: 3.5rem;
    }

    #cursor {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: var(--pink);
      border-radius: 50%;
      margin-left: 6px;
      vertical-align: middle;
      animation: blink 1.1s ease-in-out infinite;
      opacity: 0;
      transition: opacity 0.3s;
    }

    #cursor.show {
      opacity: 1;
    }

    @keyframes blink {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.15;
      }
    }

    /* ── CHOICES ── */
    #choices {
      position: absolute;
      bottom: 22%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      z-index: 60;
      width: 60%;
      max-width: 540px;
      display: none;
    }

    .choice-btn {
      background: rgba(8, 4, 14, 0.9);
      border: 1px solid rgba(244,143,177,0.35);
      border-radius: 3px;
      color: #f0e8f5;
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 1.1rem;
      font-weight: 300;
      padding: 0.8rem 1.5rem;
      cursor: pointer;
      transition: all 0.25s;
      text-align: left;
      letter-spacing: 0.02em;
      backdrop-filter: blur(6px);
    }

    .choice-btn::before {
      content: '▸ ';
      color: var(--pink);
      opacity: 0;
      margin-right: 4px;
      transition: opacity 0.2s;
    }

    .choice-btn:hover {
      background: rgba(244,143,177,0.12);
      border-color: var(--pink);
      padding-left: 2rem;
      color: #fff;
    }

    .choice-btn:hover::before {
      opacity: 1;
    }

    /* ── TITLE SCREEN ── */
    #title-screen {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 60%, #1e0a2e 0%, #050508 70%);
    }

    .title-logo {
      font-family: 'VT323', monospace;
      font-size: clamp(2.5rem, 7vw, 5rem);
      color: #fff;
      text-align: center;
      line-height: 1.15;
      text-shadow: 0 0 40px rgba(244,143,177,0.5);
      margin-bottom: 0.3rem;
      animation: titlePulse 3s ease-in-out infinite;
    }

    .title-sub {
      font-family: 'Crimson Pro', Georgia, serif;
      font-style: italic;
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      color: var(--pink);
      letter-spacing: 0.2em;
      text-align: center;
      margin-bottom: 3.5rem;
      opacity: 0.85;
    }

    @keyframes titlePulse {
      0%, 100% {
        text-shadow: 0 0 40px rgba(244,143,177,0.5);
      }
      50% {
        text-shadow: 0 0 80px rgba(244,143,177,0.9), 0 0 120px rgba(244,143,177,0.3);
      }
    }

    .start-btn {
      font-family: 'VT323', monospace;
      font-size: 1.8rem;
      color: var(--pink);
      background: transparent;
      border: 1px solid rgba(244,143,177,0.4);
      padding: 0.6rem 2.5rem;
      cursor: pointer;
      letter-spacing: 0.15em;
      transition: all 0.3s;
      animation: startPulse 2s ease-in-out infinite;
    }

    .start-btn:hover {
      background: rgba(244,143,177,0.1);
      border-color: var(--pink);
      box-shadow: 0 0 20px rgba(244,143,177,0.3);
    }

    @keyframes startPulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.6;
      }
    }

    /* ── TRANSITIONS ── */
    #fade {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s;
    }

    #fade.in {
      opacity: 1;
      pointer-events: all;
    }

    /* ── SCANLINES ── */
    #scanlines {
      position: fixed;
      inset: 0;
      z-index: 300;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.04) 2px,
        rgba(0,0,0,0.04) 4px
      );
      opacity: 0.6;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 700px) {
      .char-sprite {
        width: 140px;
        height: 240px;
      }

      .char-svg {
        width: 140px;
        height: 240px;
      }

      #dialogue {
        font-size: 1rem;
      }

      #choices {
        width: 90%;
        bottom: 18%;
      }
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="bg" class="scene-classroom"></div>

    <div id="chars">
      <!-- Nami - Personnage principal -->
      <div class="char-sprite hidden" id="char-nami">
        <svg class="char-svg" viewBox="0 0 200 340" xmlns="http://www.w3.org/2000/svg">
          <!-- NAMI - bleu/gris, cheveux courts, air sérieux -->
          <rect x="65" y="240" width="70" height="90" rx="4" fill="#1565c0"/>
          <path d="M55,290 Q100,305 145,290 L155,340 L45,340 Z" fill="#1976d2"/>
          <!-- Veste -->
          <rect x="60" y="238" width="80" height="50" rx="3" fill="#0d47a1"/>
          <rect x="95" y="238" width="10" height="50" fill="#1565c0"/>
          <!-- Cravate -->
          <path d="M100,238 L96,270 L100,278 L104,270 Z" fill="#ef5350"/>
          <!-- Bras -->
          <rect x="28" y="240" width="36" height="16" rx="8" fill="#1565c0"/>
          <rect x="136" y="240" width="36" height="16" rx="8" fill="#1565c0"/>
          <circle cx="24" cy="252" r="9" fill="#e0d0c8"/>
          <circle cx="176" cy="252" r="9" fill="#e0d0c8"/>
          <!-- Cou -->
          <rect x="88" y="215" width="24" height="28" rx="4" fill="#e0d0c8"/>
          <!-- Tête -->
          <ellipse cx="100" cy="188" rx="50" ry="53" fill="#e0d0c8"/>
          <!-- Cheveux courts bleu-gris -->
          <path d="M52,188 Q55,125 100,115 Q145,125 148,188 Z" fill="#455a64"/>
          <path d="M52,188 Q44,200 50,215" fill="#455a64"/>
          <path d="M148,188 Q156,200 150,215" fill="#455a64"/>
          <!-- Mèche -->
          <path d="M60,160 Q80,140 100,148" fill="#37474f"/>
          <!-- Lunettes -->
          <rect x="70" y="180" width="24" height="16" rx="8" fill="none" stroke="#78909c" stroke-width="2.5"/>
          <rect x="106" y="180" width="24" height="16" rx="8" fill="none" stroke="#78909c" stroke-width="2.5"/>
          <line x1="94" y1="188" x2="106" y2="188" stroke="#78909c" stroke-width="2"/>
          <!-- Yeux derrière lunettes -->
          <ellipse cx="82" cy="188" rx="8" ry="7" fill="white" opacity="0.7"/>
          <ellipse cx="118" cy="188" rx="8" ry="7" fill="white" opacity="0.7"/>
          <ellipse cx="83" cy="189" rx="5" ry="5" fill="#1565c0"/>
          <ellipse cx="119" cy="189" rx="5" ry="5" fill="#1565c0"/>
          <circle cx="85" cy="186" r="2" fill="white"/>
          <circle cx="121" cy="186" r="2" fill="white"/>
          <!-- Sourcils froncés -->
          <path d="M71,175 Q82,170 93,174" stroke="#37474f" stroke-width="2.5" fill="none"/>
          <path d="M107,174 Q118,170 129,175" stroke="#37474f" stroke-width="2.5" fill="none"/>
          <!-- Bouche neutre -->
          <path d="M90,207 L110,207" stroke="#b09090" stroke-width="2" fill="none" stroke-linecap="round"/>
          <!-- Nez -->
          <ellipse cx="100" cy="198" rx="4" ry="2.5" fill="#d0b8b0"/>
        </svg>
      </div>
    </div>

    <!-- TITLE SCREEN -->
    <div id="title-screen">
      <div class="title-logo">✦ THE LITERARY<br>CLUB ✦</div>
      <div class="title-sub">une histoire linéaire de métafiction</div>
      <button class="start-btn" onclick="startGame()">[ COMMENCER ]</button>
    </div>

    <!-- TEXTBOX -->
    <div id="textbox-wrap">
      <div id="textbox" onclick="engine.nextScene()">
        <div id="nametag">???</div>
        <div id="dialogue"><span id="dialogue-text"></span><span id="cursor">●</span></div>
      </div>
    </div>

    <!-- CHOICES -->
    <div id="choices"></div>

    <!-- OVERLAYS -->
    <div id="scanlines"></div>
    <div id="fade"></div>
  </div>

  <!-- SCRIPTS -->
  <script src="js/scenes.js"></script>
  <script src="js/dialogue.js"></script>
  <script src="js/player.js"></script>
  <script src="js/game.js"></script>

  <script>
    // Initialisation au chargement
    window.addEventListener('DOMContentLoaded', () => {
      // Créer une instance globale du moteur
      window.engine = new GameEngine();
      window.engine.init();
    });
  </script>
</body>
</html>
