<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHAMBRE 404</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ÉCRAN TITRE -->
  <div id="screen-title" class="screen active">
    <div class="title-content">
      <div class="title-glitch" data-text="CHAMBRE 404">CHAMBRE 404</div>
      <p class="title-sub">Tu t'es réveillé. Tu ne sais pas où tu es.<br>Quelqu'un est avec toi.</p>
      <button class="btn-main" onclick="Game.startGame()">COMMENCER</button>
      <p class="title-warning">⚠ Contient des thèmes de détresse psychologique</p>
    </div>
  </div>

  <!-- ÉCRAN PRINCIPAL DE JEU -->
  <div id="screen-game" class="screen">

    <!-- ZONE DE SCÈNE (image / environnement) -->
    <div id="scene-area">
      <canvas id="scene-canvas"></canvas>
      <!-- Hotspots cliquables superposés -->
      <div id="hotspots-layer"></div>
      <!-- Nom de la zone actuelle -->
      <div id="location-label"></div>
    </div>

    <!-- BOÎTE DE DIALOGUE -->
    <div id="dialogue-box" class="hidden">
      <div id="dialogue-portrait">
        <canvas id="portrait-canvas"></canvas>
      </div>
      <div id="dialogue-content">
        <div id="dialogue-speaker"></div>
        <div id="dialogue-text"></div>
        <div id="dialogue-continue">▶</div>
      </div>
    </div>

    <!-- CHOIX DE DIALOGUE -->
    <div id="choices-box" class="hidden">
      <div id="choices-list"></div>
    </div>

    <!-- INVENTAIRE / HUD -->
    <div id="hud">
      <div id="inventory-bar">
        <span class="hud-label">INVENTAIRE</span>
        <div id="inventory-items"></div>
      </div>
      <div id="sanity-bar">
        <span class="hud-label">ÉTAT MENTAL</span>
        <div id="sanity-track">
          <div id="sanity-fill"></div>
        </div>
      </div>
    </div>

    <!-- MENU NAVIGATION (zones) -->
    <div id="nav-bar">
      <div id="nav-label">OÙ ALLER ?</div>
      <div id="nav-exits"></div>
    </div>

  </div>

  <!-- ÉCRAN DE FIN -->
  <div id="screen-end" class="screen">
    <div class="end-content">
      <div id="end-title"></div>
      <div id="end-text"></div>
      <button class="btn-main" onclick="Game.restartGame()">RECOMMENCER</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
